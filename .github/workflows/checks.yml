name: Source checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      BAILONG_ISOLATED: "1"
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-enhanced.txt
      - run: python -m pip install -r requirements-enhanced.txt
      - run: python -m compileall -q app tools
      # Qt application state is process-global. Use the same module-isolated
      # runner as release validation, rather than importing all UI suites into
      # one process and leaking theme/motion preferences between modules.
      - run: python tools/check_source.py
      - run: python tools/check_program_bootstrap.py
